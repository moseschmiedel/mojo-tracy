[workspace]
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-tracy"
platforms = ["osx-arm64"]
version = "0.2.0"

[tasks]
build-native = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release"
build-profiler = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMOJO_TRACY_BUILD_PROFILER=ON && cmake --build build --config Release --target tracy-profiler"
package = "rattler-build build --recipe recipe/recipe.yaml --output-dir build/conda -c https://conda.modular.com/max-nightly -c conda-forge"
example = { cmd = "DYLD_LIBRARY_PATH=build mojo run -I src -Xlinker -Lbuild -Xlinker -lmojotracy examples/basic.mojo", depends-on = ["build-native"] }
build-example = { cmd = "mojo build -I src -Xlinker -Lbuild -Xlinker -lmojotracy -Xlinker -rpath -Xlinker @executable_path examples/basic.mojo -o build/basic", depends-on = ["build-native"] }

[dependencies]
mojo = "==1.0.0b3.dev2026062206"
rattler-build = ">=0.47.0,<0.48"
