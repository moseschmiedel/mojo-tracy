context:
  name: mojo-tracy
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..
  use_gitignore: false
  filter:
    include:
      - CMakeLists.txt
      - native/**
      - src/**
      - LICENSE
      - changelog.md
    exclude:
      - "**/.git/**"
      - "**/.pixi/**"
      - "**/build/**"
      - "tracy/profiler/build/**"

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - mojo-compiler >=1.0.0,<2
    - cmake
    - git
    - pkg-config
    - if: unix
      then: make
  host:
    - mojo-compiler >=1.0.0,<2
    - if: osx
      then:
        - clang
    - if: linux
      then:
        - dbus
        - libegl-devel
        - libxkbcommon
        - wayland
  run:
    - mojo-compiler >=1.0.0,<2

tests:
  - package_contents:
      files:
        - bin/tracy-profiler
        - lib/mojo/tracy.mojoc
      lib:
        - mojotracy
  - script:
      file: smoke_test.sh

about:
  summary: Mojo bindings for the Tracy profiler
  description: Mojo bindings and native shim for Tracy CPU zones, messages, frames, plots, thread names, and connection status.
  license: MIT
  license_file: LICENSE

extra:
  maintainers:
    - moseschmiedel
  project_name: mojo-tracy
